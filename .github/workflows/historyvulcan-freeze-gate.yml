name: HistoryVulcan Freeze Gate

on:
  push:
    branches:
      - 2026-023-HistoryVulcan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Build and test frozen contract
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out HistoryVulcan
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore .\HistoryVulcan.sln --locked-mode

      - name: Build Debug
        run: dotnet build .\HistoryVulcan.sln -c Debug --no-restore

      - name: Test Debug
        run: >-
          dotnet test .\b-Code-Tests\HistoryVulcan.Tests\HistoryVulcan.Tests.csproj
          -c Debug --no-build --no-restore
          --logger "trx;LogFileName=debug.trx"
          --results-directory artifacts\test-results

      - name: Build Release
        run: dotnet build .\HistoryVulcan.sln -c Release --no-restore

      - name: Test Release
        run: >-
          dotnet test .\b-Code-Tests\HistoryVulcan.Tests\HistoryVulcan.Tests.csproj
          -c Release --no-build --no-restore
          --logger "trx;LogFileName=release.trx"
          --results-directory artifacts\test-results

      - name: Verify formatting
        run: dotnet format .\HistoryVulcan.sln --verify-no-changes --no-restore

      - name: Verify frozen public API
        shell: pwsh
        run: .\b-Code-HistoryVulcan\eng\Assert-PublicApiBaseline.ps1

      - name: Verify quality gate
        shell: pwsh
        run: .\b-Code-HistoryVulcan\eng\Test-QualityGate.ps1

      - name: Report test failures
        if: failure()
        shell: pwsh
        run: .\b-Code-HistoryVulcan\eng\Write-TrxFailureAnnotations.ps1 -ResultsDirectory .\artifacts\test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: historyvulcan-test-results
          path: artifacts\test-results
          if-no-files-found: warn
